name: Omgeving berekenen

# Rekent per land de omgeving van campings en camperplaatsen uit OpenStreetMap (Geofabrik):
# water, rivier, kust, bos, natuurgebied, bergtoppen, supermarkt, restaurants, wandel- en fietsroutes.
# Het resultaat (omgeving-LAND.ndjson.gz) komt als bijlage bij de release "data" van deze repository.
# De Routemaatje-server haalt het daar op. Er zijn geen wachtwoorden of geheimen voor nodig.
#
# Welke landen meedoen: repository-variabele OMGEVING_LANDEN (bijv. "lu" of "lu,nl,be").
# Zonder die variabele doet alleen Luxemburg mee (klein, voor de eerste test).
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan:
    name: Landen kiezen
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.kies.outputs.matrix }}
    steps:
      - id: kies
        env:
          LANDEN: ${{ vars.OMGEVING_LANDEN || 'lu' }}
        run: |
          ALLE='[{"land":"lu","pad":"europe/luxembourg"},{"land":"nl","pad":"europe/netherlands"},{"land":"be","pad":"europe/belgium"},{"land":"at","pad":"europe/austria"},{"land":"ch","pad":"europe/switzerland"},{"land":"pt","pad":"europe/portugal"},{"land":"es","pad":"europe/spain"},{"land":"it","pad":"europe/italy"},{"land":"fr","code":"fr1","pad":"europe/france","kern":"-6,41,1.5,45","extract":"-6.15,40.85,1.65,45.15"},{"land":"fr","code":"fr2","pad":"europe/france","kern":"1.5,41,10,45","extract":"1.35,40.85,10.15,45.15"},{"land":"fr","code":"fr3","pad":"europe/france","kern":"-6,45,0.5,48","extract":"-6.15,44.85,0.65,48.15"},{"land":"fr","code":"fr4","pad":"europe/france","kern":"0.5,45,4,48","extract":"0.35,44.85,4.15,48.15"},{"land":"fr","code":"fr5","pad":"europe/france","kern":"4,45,10,48","extract":"3.85,44.85,10.15,48.15"},{"land":"fr","code":"fr6","pad":"europe/france","kern":"-6,48,1,52","extract":"-6.15,47.85,1.15,52.15"},{"land":"fr","code":"fr7","pad":"europe/france","kern":"1,48,4,52","extract":"0.85,47.85,4.15,52.15"},{"land":"fr","code":"fr8","pad":"europe/france","kern":"4,48,10,52","extract":"3.85,47.85,10.15,52.15"},{"land":"de","code":"de1","pad":"europe/germany","kern":"5,47,9.5,49.5","extract":"4.85,46.85,9.65,49.65"},{"land":"de","code":"de2","pad":"europe/germany","kern":"9.5,47,16,49.5","extract":"9.35,46.85,16.15,49.65"},{"land":"de","code":"de3","pad":"europe/germany","kern":"5,49.5,9.5,51.5","extract":"4.85,49.35,9.65,51.65"},{"land":"de","code":"de4","pad":"europe/germany","kern":"9.5,49.5,16,51.5","extract":"9.35,49.35,16.15,51.65"},{"land":"de","code":"de5","pad":"europe/germany","kern":"5,51.5,10.5,56","extract":"4.85,51.35,10.65,56.15"},{"land":"de","code":"de6","pad":"europe/germany","kern":"10.5,51.5,16,56","extract":"10.35,51.35,16.15,56.15"},{"land":"gb","pad":"europe/united-kingdom"},{"land":"no","pad":"europe/norway"},{"land":"se","pad":"europe/sweden"},{"land":"pl","pad":"europe/poland"},{"land":"cz","pad":"europe/czech-republic"},{"land":"fi","pad":"europe/finland"}]'
          KEUZE="$(echo "$ALLE" | jq -c --arg l ",${LANDEN// /}," '[.[] | select(. as $o | $l | contains("," + $o.land + ","))]')"
          echo "Gekozen: $KEUZE"
          echo "matrix=$KEUZE" >> "$GITHUB_OUTPUT"

  land:
    name: ${{ matrix.code || matrix.land }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Gereedschap installeren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          python3 -m pip install --quiet numpy scipy

      - name: Test van de rekenlogica
        run: python3 test/test_omgeving.py

      - name: Landbestand ophalen (Geofabrik, anders reservebron)
        run: |
          mkdir -p data
          UA="Routemaatje-omgeving (info@routemaatje.nl)"
          if curl -fsSL --connect-timeout 20 --retry 2 --retry-delay 10 --retry-all-errors -A "$UA" \
               -o data/land.osm.pbf "https://download.geofabrik.de/${{ matrix.pad }}-latest.osm.pbf"; then
            echo "Bron: Geofabrik"
          else
            echo "Geofabrik niet bereikbaar, reservebron: OpenStreetMap-France"
            curl -fsSL --connect-timeout 20 --retry 3 --retry-delay 20 --retry-all-errors -A "$UA" \
              -D data/kop.txt -o data/land.osm.pbf "https://download.openstreetmap.fr/extracts/$(echo "${{ matrix.pad }}" | tr - _)-latest.osm.pbf"
            grep -i '^last-modified' data/kop.txt || true
          fi
          ls -lh data/land.osm.pbf
          osmium fileinfo -g header.option.osmosis_replication_timestamp data/land.osm.pbf || true

      - name: Tegel uitsnijden (Frankrijk en Duitsland)
        if: matrix.extract
        run: |
          set -euo pipefail
          cd data
          osmium extract -b "${{ matrix.extract }}" --strategy=smart land.osm.pbf -o tegel.osm.pbf --overwrite
          mv tegel.osm.pbf land.osm.pbf
          ls -lh land.osm.pbf

      - name: Filteren en omzetten
        run: |
          set -euo pipefail
          cd data
          osmium tags-filter land.osm.pbf \
            nwr/tourism=camp_site,caravan_site \
            nwr/natural=water,coastline,beach,peak,volcano,wood \
            nwr/waterway=river \
            nwr/landuse=forest,reservoir \
            nwr/leisure=nature_reserve \
            nwr/boundary=national_park,protected_area \
            nwr/shop=supermarket \
            nwr/amenity=restaurant \
            -o gefilterd.osm.pbf --overwrite
          osmium export gefilterd.osm.pbf -f geojsonseq \
            --geometry-types=point,linestring,polygon --add-unique-id=type_id \
            -o export.geojsonseq --overwrite
          for soort in hiking bicycle; do
            osmium tags-filter land.osm.pbf r/route=$soort -o r-$soort.osm.pbf --overwrite
            osmium add-locations-to-ways --ignore-missing-nodes r-$soort.osm.pbf -o r-$soort-l.osm.pbf --overwrite
            osmium export r-$soort-l.osm.pbf -f geojsonseq --geometry-types=linestring --keep-untagged \
              -o routes-$soort.geojsonseq --overwrite
          done
          ls -lh

      - name: Omgeving berekenen
        env:
          KERN: ${{ matrix.kern }}
        run: |
          set -euo pipefail
          mkdir -p uit
          python3 omgeving.py "${{ matrix.land }}" data/export.geojsonseq \
            data/routes-hiking.geojsonseq data/routes-bicycle.geojsonseq \
            -o "uit/omgeving-${{ matrix.code || matrix.land }}.ndjson.gz" --datum "$(date -u +%Y%m%d)" ${KERN:+--kern="$KERN"}
          ls -lh uit

      - name: Publiceren bij de release "data"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view data >/dev/null 2>&1 || gh release create data \
            --title "Omgevingsgegevens" \
            --notes "Per land berekend uit OpenStreetMap (ODbL, © OpenStreetMap-bijdragers). Wordt elke week ververst."
          gh release upload data "uit/omgeving-${{ matrix.code || matrix.land }}.ndjson.gz" --clobber
